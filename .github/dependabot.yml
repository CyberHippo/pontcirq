version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6; 7.x breaks npm ci.
      - dependency-name: typescript
        versions: [">=7"]
